<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING FOOD HALAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#150E08;
    --surface:#221609;
    --surface-2:#2C1D0E;
    --line: rgba(212,162,76,0.18);
    --gold:#D4A24C;
    --gold-soft: rgba(212,162,76,0.14);
    --crimson:#B7211D;
    --crimson-soft: rgba(183,33,29,0.18);
    --cream:#F7EDE0;
    --text:#F3E9DA;
    --text-dim:#C9B79C;
    --success:#5FA875;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(212,162,76,0.10), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(183,33,29,0.12), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 100%);
  }
  ::selection{ background: var(--gold-soft); }
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  /* ---------- Header ---------- */
  header.topbar{
    display:flex; align-items:center; gap:10px;
    padding:16px 18px 12px 18px;
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .crest{
    width:38px; height:38px; flex:none;
  }
  .brandtext{
    display:flex; flex-direction:column; line-height:1.05;
  }
  .brandtext b{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
    color:var(--cream);
  }
  .brandtext span{
    font-size:10px;
    letter-spacing:2.5px;
    color:var(--gold);
    text-transform:uppercase;
    font-weight:600;
  }
  .headline-spacer{flex:1;}
  .icon-btn{
    background:var(--surface); border:1px solid var(--line);
    width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold); cursor:pointer;
  }

  /* ---------- Main ---------- */
  main{ flex:1; padding: 4px 18px 96px 18px; }

  h1.pagehead{
    font-family:'Cormorant Garamond', serif;
    font-size:28px; font-weight:700; color:var(--cream);
    margin: 6px 0 2px 0;
  }
  p.subhead{ color:var(--text-dim); font-size:13.5px; margin:0 0 20px 0; line-height:1.5;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; cursor:pointer; border-radius:14px;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px;
    padding:14px 18px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: linear-gradient(135deg, var(--crimson), #8f1a17); color:var(--cream); box-shadow: 0 8px 20px rgba(183,33,29,0.35);}
  .btn-gold{ background: linear-gradient(135deg, var(--gold), #b9803a); color:#241505; box-shadow: 0 8px 20px rgba(212,162,76,0.25);}
  .btn-ghost{ background: var(--surface); color:var(--cream); border:1px solid var(--line);}
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 12px; font-size:12.5px; border-radius:10px; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }

  /* ---------- Inputs ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-weight:700;}
  .field select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:13px 14px; border-radius:12px; font-size:14px; font-family:'Manrope',sans-serif;
    outline:none; appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23D4A24C' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }
  .field select:disabled{ opacity:0.4; }
  .field input, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:13px 14px; border-radius:12px; font-size:14.5px; font-family:'Manrope',sans-serif;
    outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--gold); }
  .field .hint{ font-size:11.5px; color:var(--text-dim); margin-top:5px; }
  .field .err{ font-size:11.5px; color:#e08b7d; margin-top:5px; display:none;}

  /* ---------- Auth screen ---------- */
  .auth-wrap{ padding-top:8vh; text-align:center; }
  .auth-crest{ width:88px; height:88px; margin:0 auto 18px auto; }
  .auth-title{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:32px; color:var(--cream); margin:0;}
  .auth-sub{ color:var(--text-dim); font-size:13.5px; margin:6px 0 30px 0;}
  .auth-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; text-align:left; box-shadow:var(--shadow);}
  .divider{ display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:11px; margin:16px 0; text-transform:uppercase; letter-spacing:1px;}
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line);}
  .google-btn{ background:var(--cream); color:#3c2a12; }

  /* ---------- Category chips ---------- */
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 16px 0; }
  .chip{
    flex:none; padding:9px 15px; border-radius:999px; font-size:12.5px; font-weight:700;
    background:var(--surface); border:1px solid var(--line); color:var(--text-dim); cursor:pointer;
  }
  .chip.active{ background: var(--gold-soft); border-color:var(--gold); color:var(--gold); }

  /* ---------- Food card ---------- */
  .food-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; display:flex; gap:12px; margin-bottom:12px; position:relative;
  }
  .food-emoji{
    width:64px; height:64px; border-radius:14px; flex:none;
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    display:flex; align-items:center; justify-content:center; font-size:30px;
    border:1px solid var(--line);
  }
  .food-info{ flex:1; min-width:0; }
  .food-name{ font-weight:700; font-size:15px; color:var(--cream); margin:0 0 2px 0;}
  .food-desc{ font-size:12px; color:var(--text-dim); margin:0 0 8px 0; line-height:1.4;}
  .food-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .food-price{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold); font-size:14.5px;}
  .halal-badge{
    position:absolute; top:10px; right:10px; font-size:9px; font-weight:800; letter-spacing:0.5px;
    background: var(--crimson-soft); color:#e79d92; padding:3px 7px; border-radius:6px; border:1px solid rgba(183,33,29,0.4);
  }
  .qty-ctl{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:10px; padding:4px 6px; border:1px solid var(--line);}
  .qty-ctl button{ width:24px;height:24px; border-radius:6px; border:none; background:var(--surface); color:var(--gold); font-weight:800; cursor:pointer; font-size:14px;}
  .qty-ctl span{ min-width:16px; text-align:center; font-weight:700; font-size:13px;}
  .add-btn{ background:var(--gold); color:#241505; border:none; border-radius:10px; padding:8px 12px; font-weight:800; font-size:12.5px; cursor:pointer;}

  /* ---------- Empty state ---------- */
  .empty{ text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty .em{ font-size:40px; margin-bottom:10px;}
  .empty b{ display:block; color:var(--cream); font-size:15px; margin-bottom:4px;}

  /* ---------- Cart ---------- */
  .cart-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:10px;}
  .cart-item .food-emoji{ width:44px;height:44px; font-size:22px; border-radius:10px;}
  .cart-item .ci-name{ font-weight:700; font-size:13.5px; color:var(--cream); margin:0;}
  .cart-item .ci-price{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold);}
  .cart-item .ci-remove{ background:none; border:none; color:#e08b7d; font-size:17px; cursor:pointer; padding:4px;}

  .summary-box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:16px 0;}
  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; color:var(--text-dim); margin-bottom:8px;}
  .summary-row.total{ color:var(--cream); font-weight:800; font-size:16px; border-top:1px solid var(--line); padding-top:10px; margin-top:4px;}
  .summary-row .val{ font-family:'JetBrains Mono',monospace; color:var(--cream); }

  /* ---------- Map ---------- */
  .map-box{ position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); height:190px; margin-bottom:16px;
    background: var(--surface-2);
  }
  .map-box .leaflet-container{ width:100%; height:100%; background:var(--surface-2); font-family:'Manrope',sans-serif; }
  .map-box .leaflet-control-attribution{ font-size:8px; background:rgba(21,14,8,0.7)!important; color:var(--text-dim)!important; }
  .map-box .leaflet-control-attribution a{ color:var(--gold)!important; }
  .courier-pin{ font-size:22px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6)); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .eta-badge{
    position:absolute; bottom:10px; left:10px; z-index:500; background:rgba(21,14,8,0.9); border:1px solid var(--gold);
    color:var(--gold); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px;
    padding:6px 10px; border-radius:10px; pointer-events:none;
  }
  .map-locating{
    position:absolute; inset:0; z-index:600; display:flex; align-items:center; justify-content:center;
    background:rgba(21,14,8,0.55); color:var(--gold); font-size:12.5px; font-weight:700; pointer-events:none;
  }
  .addr-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---------- Order confirmation ---------- */
  .order-status{ text-align:center; padding:26px 10px; }
  .order-timer{
    font-family:'JetBrains Mono',monospace; font-size:44px; font-weight:700; color:var(--gold);
    margin:10px 0;
  }

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:rgba(21,14,8,0.92); backdrop-filter: blur(10px);
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; color:var(--text-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 2px; cursor:pointer; font-family:'Manrope',sans-serif; font-size:10px; font-weight:700; position:relative;
  }
  nav.bottomnav button .ic{ font-size:19px; }
  nav.bottomnav button.active{ color:var(--gold); }
  .navbadge{
    position:absolute; top:2px; right:22%; background:var(--crimson); color:#fff; font-size:9px; font-weight:800;
    min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* ---------- Admin ---------- */
  .admin-item-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 10px; margin-bottom:8px;}
  .admin-item-row .food-emoji{ width:36px;height:36px;font-size:18px;border-radius:8px;}
  .admin-item-row .aname{ font-size:13px; font-weight:700; color:var(--cream); flex:1; }
  .admin-item-row .adel{ background:none;border:none;color:#e08b7d;font-size:16px;cursor:pointer;}
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pin-wrap{ text-align:center; padding-top:10vh;}
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin:20px 0;}
  .pin-dots span{ width:14px;height:14px;border-radius:50%; border:1px solid var(--gold); }
  .pin-dots span.filled{ background:var(--gold); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:260px; margin:0 auto;}
  .keypad button{ background:var(--surface); border:1px solid var(--line); color:var(--cream); font-size:20px; font-weight:700; border-radius:16px; padding:16px 0; cursor:pointer;}
  .keypad button:active{ background:var(--gold-soft); }

  /* ---------- Chat ---------- */
  .chat-scroll{ display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .msg{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; max-width:86%; }
  .msg .m-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .msg .m-name{ font-weight:800; font-size:12.5px; color:var(--gold);}
  .msg .m-time{ font-size:10px; color:var(--text-dim);}
  .msg .m-text{ font-size:13.5px; color:var(--text); line-height:1.45; white-space:pre-wrap;}
  .msg .m-stars{ color:var(--gold); font-size:12px; margin-bottom:3px;}
  .msg img.m-img{ max-width:100%; border-radius:10px; margin-top:6px; display:block; }
  .chat-input-bar{
    position:fixed; bottom:64px; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    background:var(--bg); border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:8px; align-items:center; z-index:25;
  }
  .chat-input-bar input[type=text]{ flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:20px; padding:11px 16px; font-size:13.5px; outline:none;}
  .round-btn{ width:40px;height:40px;border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--gold); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
  .round-btn.send{ background:var(--crimson); color:#fff; border:none; }
  .star-picker{ display:flex; gap:4px; margin-bottom:8px;}
  .star-picker span{ font-size:20px; cursor:pointer; opacity:0.35;}
  .star-picker span.on{ opacity:1;}

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--gold); color:#241505; font-weight:800; font-size:13px; padding:10px 18px; border-radius:12px;
    z-index:60; transition: all .25s ease; pointer-events:none; box-shadow:var(--shadow); max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="shell">
  <header class="topbar" id="topbar"></header>
  <main id="app"></main>
  <div id="chatbar"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>

/* ================= ▼▼▼ ЖӨНГӨ САЛУУ (өзүңүздүн номериңизди коюңуз) ▼▼▼ =================

/* ================= ▲▲▲ ЖӨНГӨ САЛУУ АЯКТАДЫ ▲▲▲ ================= */

const CATS = ['Баары','Бургер','Шаурма','Тоок','Пицца','Ичимдик'];

/* ================= STORAGE HELPERS ================= */
async function sGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
  catch(e){ console.error('storage error', e); return false; }
}

/* ================= INIT ================= */
async function boot(){
  const profile = await sGet('kfh:profile', false);
  if(profile){ state.profile = profile; state.view = 'menu'; }

  let menu = await sGet('kfh:menu', true);
  if(!menu || !Array.isArray(menu) || menu.length === 0){
    menu = DEFAULT_MENU;
    await sSet('kfh:menu', menu, true);
  }
  state.menu = menu;

  const cart = await sGet('kfh:cart', false);
  if(cart) state.cart = cart;

  const savedAddr = await sGet('kfh:address', false);
  if(savedAddr){
    state.addrOblast = savedAddr.oblast || '';
    state.addrDistrict = savedAddr.district || '';
    state.addrStreet = savedAddr.street || '';
  }

  const chat = await sGet('kfh:chat', true);
  state.chat = chat || [];

  render();
  setInterval(pollShared, 4000);
}

function isUserTyping(){
  const el = document.activeElement;
  return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT'));
}

async function pollShared(){
  const menu = await sGet('kfh:menu', true);
  if(menu) state.menu = menu;
  const chat = await sGet('kfh:chat', true);
  if(chat) state.chat = chat;
  if(isUserTyping()) return; // don't interrupt someone typing an address/message
  if(state.view === 'menu' || state.view === 'admin' || state.view === 'chat' || state.view === 'cart'){
    render();
  }
}

/* ================= UTIL ================= */
function money(n){ return n.toLocaleString('ru-RU') + ' сом'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
function cartTotal(){
  return Object.entries(state.cart).reduce((sum,[id,qty])=>{
    const item = state.menu.find(m=>m.id===id);
    return sum + (item ? item.price*qty : 0);
  },0);
}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return 'азыр эле';
  if(diff<3600) return Math.floor(diff/60)+' мүн мурун';
  return Math.floor(diff/3600)+' саат мурун';
}

/* ================= RENDER: BOTTOM NAV ================= */
function renderNav(){
  const nav = document.getElementById('bottomnav');
  if(state.view === 'auth'){ nav.innerHTML=''; return; }
  const items = [
    {id:'menu', ic:'🍽️', label:'Меню'},
    {id:'cart', ic:'🧺', label:'Себет', badge: cartCount()},
    {id:'chat', ic:'💬', label:'Чат'},
    {id:'admin', ic:'🛠️', label:'Админ'},
  ];
  nav.innerHTML = items.map(it => `
    <button data-nav="${it.id}" class="${state.view===it.id?'active':''}">
      <span class="ic">${it.ic}</span>${it.label}
      ${it.badge ? `<span class="navbadge">${it.badge}</span>` : ''}
    </button>
  `).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{ state.view = b.dataset.nav; if(b.dataset.nav!=='admin') {} render(); });
  });
}

/* ================= RENDER ROOT ================= */
function render(){
  renderTopbar();
  renderNav();
  const app = document.getElementById('app');
  const chatbar = document.getElementById('chatbar');
  chatbar.innerHTML = '';
  if(state.view === 'auth') app.innerHTML = viewAuth();
  else if(state.view === 'menu') app.innerHTML = viewMenu();
  else if(state.view === 'cart') app.innerHTML = viewCart();
  else if(state.view === 'orderStatus') app.innerHTML = viewOrderStatus();
  else if(state.view === 'admin') app.innerHTML = viewAdmin();
  else if(state.view === 'chat'){ app.innerHTML = viewChat(); chatbar.innerHTML = chatInputBar(); }
  attachHandlers();

  if(state.view === 'cart' && Object.values(state.cart).some(q=>q>0)){
    state.mapInstance = null; // force fresh init since DOM node is new
    refreshMapForCurrentAddress();
  } else if(state.view === 'orderStatus' && state.order){
    state.mapInstance = null;
    const coords = (KG_REGIONS[state.order.oblast] && KG_REGIONS[state.order.oblast].districts[state.order.district])
      || currentAddrCoords();
    initOrUpdateMap(coords, {zoom:14});
  }
}

/* ================= MAP (Leaflet + district fallback + live geocoding) ================= */
function currentAddrCoords(){
  if(state.addrOblast && state.addrDistrict && KG_REGIONS[state.addrOblast] && KG_REGIONS[state.addrOblast].districts[state.addrDistrict]){
    return KG_REGIONS[state.addrOblast].districts[state.addrDistrict];
  }
  return [42.8746, 74.5698]; // default: Бишкек
}

function initOrUpdateMap(coords, opts){
  opts = opts || {};
  const el = document.getElementById('leafletMap');
  if(!el || typeof L === 'undefined') return;
  if(!state.mapInstance || state.mapInstance._container !== el){
    // (re)create map because DOM node is fresh after re-render
    state.mapInstance = L.map(el, { zoomControl:false, attributionControl:true, dragging:true, scrollWheelZoom:false })
      .setView(coords, opts.zoom || 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18
    }).addTo(state.mapInstance);
    const icon = L.divIcon({ className:'', html:'<div class="courier-pin">📍</div>', iconSize:[26,26], iconAnchor:[13,24] });
    state.mapMarker = L.marker(coords, {icon}).addTo(state.mapInstance);
  } else {
    state.mapInstance.setView(coords, opts.zoom || state.mapInstance.getZoom());
    state.mapMarker.setLatLng(coords);
  }
  setTimeout(()=>{ if(state.mapInstance) state.mapInstance.invalidateSize(); }, 150);
}

async function tryLiveGeocode(oblast, district, street){
  if(!street || street.length < 3) return;
  const box = document.getElementById('mapBox');
  let loader;
  if(box && !box.querySelector('.map-locating')){
    loader = document.createElement('div');
    loader.className = 'map-locating';
    loader.textContent = '📍 Дарек аныкталууда...';
    box.appendChild(loader);
  }
  try{
    const query = encodeURIComponent(`${street}, ${district}, ${oblast}, Кыргызстан`);
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${query}`);
    const data = await res.json();
    if(data && data[0]){
      const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      initOrUpdateMap(coords, {zoom:16});
    }
  }catch(e){ /* geocoding failed silently, district-level pin stays */ }
  finally{
    const l = document.querySelector('.map-locating');
    if(l) l.remove();
  }
}

function refreshMapForCurrentAddress(){
  const coords = currentAddrCoords();
  const zoom = (state.addrOblast && state.addrDistrict) ? 13 : 7;
  initOrUpdateMap(coords, {zoom});
}

/* ================= ESCAPE ================= */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= VALIDATION ================= */
function validPhone(v){ return /^\+?\d[\d\s\-]{8,14}\d$/.test(v.trim()); }
function validEmail(v){ return /^[^\s@]+@gmail\.com$/i.test(v.trim()); }

/* ================= HANDLERS ================= */
function attachHandlers(){
  const app = document.getElementById('app');

  // --- AUTH ---
  const btnReg = document.getElementById('btnRegister');
  if(btnReg){
    btnReg.addEventListener('click', async ()=>{
      const phone = document.getElementById('inPhone').value;
      const email = document.getElementById('inEmail').value;
      let ok = true;
      document.getElementById('errPhone').style.display='none';
      document.getElementById('errEmail').style.display='none';
      if(!validPhone(phone)){ document.getElementById('errPhone').style.display='block'; ok=false; }
      if(!validEmail(email)){ document.getElementById('errEmail').style.display='block'; ok=false; }
      if(!ok) return;
      state.profile = {phone: phone.trim(), email: email.trim()};
      await sSet('kfh:profile', state.profile, false);
      state.view = 'menu';
      showToast('Ийгиликтүү катталдыңыз!');
      render();
    });
  }
  const btnGoogle = document.getElementById('btnGoogle');
  if(btnGoogle){
    btnGoogle.addEventListener('click', async ()=>{
      const email = prompt('Gmail дарегиңизди киргизиңиз:');
      if(!email) return;
      if(!validEmail(email)){ showToast('Gmail дареги туура эмес'); return; }
      const phone = document.getElementById('inPhone').value || 'Google колдонуучу';
      state.profile = {phone: phone.trim(), email: email.trim()};
      await sSet('kfh:profile', state.profile, false);
      state.view = 'menu';
      showToast('Google менен киришиңиз ийгиликтүү!');
      render();
    });
  }

  // --- CATEGORY CHIPS ---
  app.querySelectorAll('[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.category = el.dataset.cat; render(); });
  });

  // --- ADD / INC / DEC / REMOVE CART ---
  app.querySelectorAll('[data-add]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.add;
      state.cart[id] = (state.cart[id]||0)+1;
      await sSet('kfh:cart', state.cart, false);
      showToast('Себетке кошулду');
      render();
    });
  });
  app.querySelectorAll('[data-inc]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.inc;
      state.cart[id] = (state.cart[id]||0)+1;
      await sSet('kfh:cart', state.cart, false);
      render();
    });
  });
  app.querySelectorAll('[data-dec]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.dec;
      state.cart[id] = Math.max(0,(state.cart[id]||0)-1);
      await sSet('kfh:cart', state.cart, false);
      render();
    });
  });
  app.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.remove;
      delete state.cart[id];
      await sSet('kfh:cart', state.cart, false);
      render();
    });
  });

  // --- ADDRESS: OBLAST / DISTRICT / STREET ---
  const selOblast = document.getElementById('selOblast');
  if(selOblast){
    selOblast.addEventListener('change', ()=>{
      state.addrOblast = selOblast.value;
      state.addrDistrict = '';
      render();
    });
  }
  const selDistrict = document.getElementById('selDistrict');
  if(selDistrict){
    selDistrict.addEventListener('change', ()=>{
      state.addrDistrict = selDistrict.value;
      refreshMapForCurrentAddress();
      const s = document.getElementById('inStreet');
      if(s && s.value.trim()) tryLiveGeocode(state.addrOblast, state.addrDistrict, s.value.trim());
    });
  }
  const inStreet = document.getElementById('inStreet');
  if(inStreet){
    inStreet.addEventListener('input', ()=>{
      state.addrStreet = inStreet.value;
      clearTimeout(state.geocodeTimer);
      state.geocodeTimer = setTimeout(()=>{
        if(state.addrOblast && state.addrDistrict){
          tryLiveGeocode(state.addrOblast, state.addrDistrict, inStreet.value.trim());
        }
      }, 900);
    });
  }

  // --- PLACE ORDER ---
  const btnPlace = document.getElementById('btnPlaceOrder');
  if(btnPlace){
    btnPlace.addEventListener('click', async ()=>{
      const oblast = state.addrOblast;
      const district = state.addrDistrict;
      const street = document.getElementById('inStreet').value.trim();
      if(!oblast || !district){ showToast('Облус жана районду тандаңыз'); return; }
      if(!street){ showToast('Көчө, үй номерин жазыңыз'); return; }
      const total = cartTotal();
      const delivery = total >= 500 ? 0 : 60;
      const etaMinutes = 20 + Math.floor(Math.random()*16); // 20-35
      const fullAddress = `${street}, ${district}, ${oblast}`;
      const itemsSnapshot = Object.entries(state.cart)
        .filter(([id,qty])=>qty>0)
        .map(([id,qty])=>{
          const item = state.menu.find(m=>m.id===id);
          return item ? {name:item.name, qty, price:item.price} : null;
        }).filter(Boolean);
      state.order = {
        address: fullAddress, oblast, district,
        total: total+delivery, etaMinutes, placedAt: Date.now(),
        customerPhone: state.profile ? state.profile.phone : '—',
        items: itemsSnapshot
      };
      sendOrderToWhatsapp(state.order); // called synchronously so the browser doesn't block the popup
      await sSet('kfh:address', {oblast, district, street}, false);
      state.cart = {};
      await sSet('kfh:cart', state.cart, false);
      state.view = 'orderStatus';
      render();
      startOrderCountdown();
    });
  }
  const btnResendWA = document.getElementById('btnResendWA');
  if(btnResendWA){
    btnResendWA.addEventListener('click', ()=>{ if(state.order) sendOrderToWhatsapp(state.order); });
  }
  const btnBackToMenu = document.getElementById('btnBackToMenu');
  if(btnBackToMenu){
    btnBackToMenu.addEventListener('click', ()=>{ state.order=null; state.view='menu'; render(); });
  }

  // --- ADMIN PIN KEYPAD ---
  app.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.key;
      if(k==='') return;
      if(k==='⌫'){ state.pin = state.pin.slice(0,-1); render(); return; }
      if(state.pin.length>=4) return;
      state.pin += k;
      if(state.pin.length===4){
        if(state.pin===PIN_CODE){ state.adminUnlocked = true; state.pin=''; showToast('Кош келиңиз, админ!'); }
        else { showToast('PIN туура эмес'); state.pin=''; }
      }
      render();
    });
  });
  const btnLockAdmin = document.getElementById('btnLockAdmin');
  if(btnLockAdmin){ btnLockAdmin.addEventListener('click', ()=>{ state.adminUnlocked=false; render(); }); }

  // --- ADMIN ADD ITEM ---
  const btnAddItem = document.getElementById('btnAddItem');
  if(btnAddItem){
    btnAddItem.addEventListener('click', async ()=>{
      const name = document.getElementById('adName').value.trim();
      const price = parseInt(document.getElementById('adPrice').value,10);
      const emoji = document.getElementById('adEmoji').value.trim() || '🍽️';
      const cat = document.getElementById('adCat').value;
      const desc = document.getElementById('adDesc').value.trim();
      if(!name || !price){ showToast('Атын жана баасын толтуруңуз'); return; }
      const newItem = {id:'f'+Date.now(), name, price, cat, emoji, desc};
      state.menu = [...state.menu, newItem];
      await sSet('kfh:menu', state.menu, true);
      showToast('Меню жаңыртылды — баары көрөт!');
      render();
    });
  }
  app.querySelectorAll('[data-deleteitem]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.deleteitem;
      state.menu = state.menu.filter(m=>m.id!==id);
      await sSet('kfh:menu', state.menu, true);
      render();
    });
  });

  // --- CHAT ---
  const btnSendChat = document.getElementById('btnSendChat');
  if(btnSendChat){
    btnSendChat.addEventListener('click', sendChatMessage);
    const txt = document.getElementById('chatTextInput');
    txt.addEventListener('keydown', e=>{ if(e.key==='Enter') sendChatMessage(); });
    const imgIn = document.getElementById('chatImgInput');
    imgIn.addEventListener('change', ()=>{
      const file = imgIn.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ state.chatImgDraft = reader.result; sendChatMessage(); };
      reader.readAsDataURL(file);
    });
  }
}

async function sendChatMessage(){
  const txtEl = document.getElementById('chatTextInput');
  const text = txtEl ? txtEl.value.trim() : '';
  if(!text && !state.chatImgDraft) return;
  const name = state.profile ? state.profile.phone : 'Конок';
  const msg = { id:'m'+Date.now(), name, text: text || '📷 сүрөт', img: state.chatImgDraft || null, ts: Date.now() };
  state.chat = [...state.chat, msg];
  state.chatImgDraft = null;
  await sSet('kfh:chat', state.chat, true);
  render();
}

/* ================= WHATSAPP ORDER DELIVERY ================= */
function buildOrderMessage(order){
  const lines = [];
  lines.push('🍽️ *KING FOOD HALAL — Жаңы заказ*');
  lines.push('');
  lines.push(`👤 Кардар: ${order.customerPhone || '—'}`);
  lines.push('');
  lines.push('🧾 Буйрутма:');
  order.items.forEach(it=>{
    lines.push(`• ${it.name} × ${it.qty} — ${it.price*it.qty} сом`);
  });
  lines.push('');
  lines.push(`📍 Дарек: ${order.address}`);
  lines.push(`🗺️ Аймак: ${order.district}, ${order.oblast}`);
  lines.push(`💰 Жалпы сумма: ${order.total} сом`);
  lines.push(`⏱️ Күтүлгөн убакыт: ${order.etaMinutes} мүнөт`);
  return lines.join('\n');
}
function sendOrderToWhatsapp(order){
  const text = buildOrderMessage(order);
const url = `https://wa.me/996 778 031 203?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

/* ================= ORDER COUNTDOWN ================= */
function startOrderCountdown(){
  clearInterval(startOrderCountdown._t);
  startOrderCountdown._t = setInterval(()=>{
    if(!state.order || state.view!=='orderStatus'){ clearInterval(startOrderCountdown._t); return; }
    const elapsedSec = Math.floor((Date.now()-state.order.placedAt)/1000);
    const totalSec = state.order.etaMinutes*60;
    const remain = Math.max(0, totalSec - elapsedSec);
    const mm = String(Math.floor(remain/60)).padStart(2,'0');
    const ss = String(remain%60).padStart(2,'0');
    const timerEl = document.getElementById('orderTimer');
    const etaEl = document.getElementById('etaBadge');
    if(timerEl) timerEl.textContent = `${mm}:${ss}`;
    if(etaEl) etaEl.textContent = remain>0 ? `⏱ Даяр болууга: ${mm}:${ss}` : '✅ Тамагыңыз даяр, жеткирилүүдө!';
    if(remain<=0) clearInterval(startOrderCountdown._t);
  }, 1000);
}

boot();
</script>
